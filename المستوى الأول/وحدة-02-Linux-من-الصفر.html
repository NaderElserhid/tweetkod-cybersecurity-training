<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>المستوى الأول — الوحدة 2: Linux من الصفر: الطرفية أداتك الأولى | تويتكود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('tk:theme'));if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<style>
/* ===== TweetKod Design System v2 — ليل/نهار، RTL أولاً ===== */
:root{
  --blue:#009EE2; --yellow:#F7B228; --green:#25D366; --ok:#16a34a; --bad:#e5484d; --warn:#f59e0b;
  --bg:#EEF6F8; --bg2:#E3F1F5; --surface:rgba(255,255,255,.82); --surface2:#ffffff;
  --text:#17383A; --muted:#55726f; --line:#d5e5e8; --shadow:0 6px 24px rgba(23,56,58,.08);
  --code:#0c1f28; --codetext:#e6edf3; --glow1:rgba(0,158,226,.16); --glow2:rgba(247,178,40,.14);
  --grid:rgba(0,158,226,.07); --chip:#eef7fa; --fs:1;
}
html[data-theme="dark"]{
  --bg:#09141a; --bg2:#0c1d24; --surface:rgba(18,34,41,.78); --surface2:#12252d;
  --text:#e7f2f3; --muted:#9bb7ba; --line:#223c44; --shadow:0 8px 28px rgba(0,0,0,.45);
  --code:#050e12; --codetext:#d9e8ee;
  --chip:#14303a;
}
/* خلفية الزينة (توهّج/شبكة/عقد/مسح) ثابتة بين الليل والنهار عمداً — نفس المشهد السيبراني دائماً،
   وتبديل الوضع يغيّر فقط ألوان المحتوى (البطاقات/النصوص) لراحة القراءة */
:root{
  --glow1:rgba(0,158,226,.2); --glow2:rgba(247,178,40,.13);
  --node1:rgba(0,158,226,.5); --node2:rgba(247,178,40,.38); --node3:rgba(37,211,102,.36);
  --scan:rgba(0,158,226,.16); --scan-blend:multiply;
}
html[data-theme="dark"]{ --scan:rgba(0,158,226,.13); --scan-blend:screen; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Tajawal','IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;color:var(--text);
  background:var(--bg);overflow:hidden;font-size:calc(16px * var(--fs));line-height:1.75;-webkit-font-smoothing:antialiased}
/* خلفية جمالية: تدرّج + شبكة سيبرانية + توهّج متحرك */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(70vmax 70vmax at 90% -15%,var(--glow1),transparent 55%),
   radial-gradient(60vmax 60vmax at -15% 115%,var(--glow2),transparent 55%),
   radial-gradient(40vmax 40vmax at 50% 45%,rgba(37,211,102,.06),transparent 60%),
   linear-gradient(180deg,var(--bg),var(--bg2));}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:46px 46px;mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%);animation:tkdrift 40s linear infinite}
@keyframes tkdrift{to{background-position:46px 46px,46px 46px}}
/* شبكة عقد سيبرانية متوهّجة — إحساس أمان رقمي يتنفّس بهدوء */
html::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(2.6px 2.6px at 12% 18%,var(--node1),transparent 60%),
    radial-gradient(2.2px 2.2px at 82% 12%,var(--node2),transparent 60%),
    radial-gradient(2.6px 2.6px at 70% 64%,var(--node3),transparent 60%),
    radial-gradient(2px 2px at 25% 80%,var(--node1),transparent 60%),
    radial-gradient(2.2px 2.2px at 92% 56%,var(--node3),transparent 60%),
    radial-gradient(2px 2px at 48% 28%,var(--node2),transparent 60%),
    radial-gradient(2.2px 2.2px at 38% 92%,var(--node1),transparent 60%),
    radial-gradient(2px 2px at 6% 52%,var(--node3),transparent 60%),
    radial-gradient(2px 2px at 58% 8%,var(--node1),transparent 60%),
    radial-gradient(1.8px 1.8px at 96% 86%,var(--node2),transparent 60%);
  animation:tkpulse 7s ease-in-out infinite alternate}
@keyframes tkpulse{from{opacity:.5}to{opacity:1}}
/* شعاع مسح قطري بطيء — لمسة "رادار" سيبرانية خفيفة جداً */
html::after{content:"";position:fixed;inset:-25% -25%;z-index:0;pointer-events:none;overflow:hidden;
  background-image:
    repeating-linear-gradient(115deg,var(--scan) 0 2px,transparent 2px 190px),
    repeating-linear-gradient(25deg,var(--scan) 0 1.5px,transparent 1.5px 230px);
  opacity:.9;mix-blend-mode:var(--scan-blend);animation:tkscan 16s linear infinite}
@keyframes tkscan{to{transform:translate(7%,7%)}}
/* طوق توهّج دوّار خلف الإيموجي الكبير في شرائح العنوان */
.big-emoji{position:relative;display:inline-block}
.big-emoji::before{
  content:"";position:absolute;inset:-22px;z-index:-1;border-radius:50%;
  background:conic-gradient(from 0deg,var(--blue),var(--yellow),var(--green),var(--blue));
  filter:blur(18px);opacity:.35;animation:tkring 7s linear infinite}
@keyframes tkring{to{transform:rotate(360deg)}}
/* دخول ناعم ومتدرّج للعناصر الرئيسية عند ظهور كل شريحة */
.slide.on .tk-h1,.slide.on .lead,.slide.on .big-emoji,.slide.on .kicker{animation:tkenter .65s cubic-bezier(.2,.8,.2,1) both}
.slide.on .kicker{animation-delay:.02s}.slide.on .big-emoji{animation-delay:.04s}.slide.on .tk-h1{animation-delay:.08s}.slide.on .lead{animation-delay:.16s}
.slide.on .tag{animation:tkenter .5s cubic-bezier(.2,.8,.2,1) both}
.slide.on .tag:nth-of-type(1){animation-delay:.22s}.slide.on .tag:nth-of-type(2){animation-delay:.27s}.slide.on .tag:nth-of-type(3){animation-delay:.32s}
.slide.on .tag:nth-of-type(4){animation-delay:.37s}.slide.on .tag:nth-of-type(5){animation-delay:.42s}
@keyframes tkenter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#deck{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
.tk-topbar{height:4px;background:linear-gradient(90deg,var(--blue),var(--yellow),var(--blue));flex:none}
header.tk-head{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tk-logo{background:#fff;border-radius:10px;padding:3px 8px;display:flex;align-items:center;flex:none}
.tk-logo img{height:26px;width:auto;max-width:110px;object-fit:contain;display:block}
.tk-titles{min-width:0;flex:1;line-height:1.3}
.tk-titles .l{font-size:.72rem;font-weight:900;color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-titles .m{font-size:.82rem;font-weight:700;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-prog{flex:0 1 180px;display:flex;align-items:center;gap:8px}
.tk-prog .bar{flex:1;height:8px;border-radius:99px;background:var(--chip);border:1px solid var(--line);overflow:hidden}
.tk-prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--yellow));transition:width .35s;box-shadow:0 0 10px rgba(0,158,226,.55)}
.tk-prog span{font-size:.75rem;font-weight:800;min-width:50px;text-align:center;direction:ltr;unicode-bidi:isolate}
.tk-ic{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer;
  font-size:1rem;display:inline-flex;align-items:center;justify-content:center;flex:none;font-family:inherit;font-weight:800;transition:.15s}
.tk-ic:hover{border-color:var(--blue);transform:translateY(-1px)}
@media(max-width:640px){.tk-titles{display:none}.tk-prog{flex:1}}

.tk-stage{position:relative;flex:1;min-height:0;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;pointer-events:none;
  transform:translateX(-26px) scale(.995);transition:opacity .35s,transform .35s;padding:clamp(14px,2.6vw,26px) clamp(14px,6vw,7vw) clamp(14px,2.6vw,26px)}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide>.in{max-width:980px;margin:0 auto}
.tk-nav{flex:none;position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px clamp(14px,4vw,28px);background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line)}
.tk-nav button{min-width:110px}
@media(max-width:480px){.tk-nav button{min-width:0;flex:1}}

/* عناصر عامة */
h1.tk-h1{font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.3;margin:.2em 0;font-weight:900}
h2.tk-h2{font-size:clamp(1.15rem,3.2vw,1.5rem);margin:.1em 0 .6em;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tk-h2 .en,.tk-h1 .en{display:block;width:100%;font-size:.5em;font-weight:600;color:var(--muted);direction:ltr;text-align:start;opacity:.9}
.kicker{color:var(--blue);font-weight:900;letter-spacing:.5px;font-size:.85rem;margin-bottom:4px}
.lead{font-size:1.05rem;color:var(--muted);line-height:1.9;max-width:820px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:calc(100dvh - 240px)}
.big-emoji{font-size:clamp(2.4rem,8vw,3.6rem);filter:drop-shadow(0 6px 14px rgba(0,158,226,.3))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2.2vw,22px);margin:12px 0;box-shadow:var(--shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-3px);border-color:rgba(0,158,226,.4);box-shadow:0 14px 34px rgba(0,158,226,.14),var(--shadow)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:1fr 1fr}}@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:.76rem;padding:3px 12px;border-radius:99px;background:var(--chip);border:1px solid var(--line);color:var(--muted);font-weight:700;margin:2px}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:9px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
ul.clean li:last-child{border:0}
.mt{margin-top:12px}.mt2{margin-top:22px}.tc{text-align:center}.sm{font-size:.86rem}.muted{color:var(--muted)}
.tip,.warn,.note,.flag{border-radius:14px;padding:10px 14px;margin:10px 0;font-size:.9rem;line-height:1.75}
.tip{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.45);color:var(--text)}
.note{background:rgba(247,178,40,.14);border:1px solid rgba(247,178,40,.5)}
.warn,.flag{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.4)}
.tip b:first-child,.note b:first-child,.warn b:first-child{margin-inline-end:4px}
.codebox{background:var(--code);color:var(--codetext);border-radius:14px;padding:13px 16px;font-family:'Cascadia Code','Courier New',monospace;direction:ltr;text-align:left;
  font-size:.82rem;line-height:1.85;overflow-x:auto;margin:10px 0;white-space:pre-wrap;word-break:break-word}
code,.code{font-family:'Cascadia Code','Courier New',monospace;direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--code);color:#7ee787;padding:1px 8px;border-radius:6px;font-size:.82rem;word-break:break-word}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tblwrap{overflow-x:auto;border-radius:12px;margin-top:8px;border:1px solid var(--line);background:var(--surface);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
table.tbl th{background:var(--chip);color:var(--blue);padding:9px 12px;text-align:start;border-bottom:2px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;background:var(--surface2)}
.term{border:1px dashed var(--line);border-radius:14px;padding:10px 14px;margin-top:12px;background:var(--surface)}
.term dt{font-weight:900;font-size:.88rem;margin-top:6px}.term dd{margin:2px 0 0;color:var(--muted);font-size:.84rem}

/* أزرار */
.btn{position:relative;overflow:hidden;background:var(--yellow);color:#1b2b2c;border:0;border-radius:14px;padding:10px 20px;font:inherit;font-weight:900;cursor:pointer;min-height:42px;
  box-shadow:0 4px 14px rgba(247,178,40,.35);transition:.15s;font-size:.92rem}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 66%);
  transform:translateX(-120%);transition:transform .55s}
.btn:hover::after{transform:translateX(120%)}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(0,158,226,.35)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.s{padding:7px 14px;font-size:.8rem;min-height:34px}
.btn:disabled{opacity:.35;cursor:default}
input[type=text],textarea,select{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:inherit;min-height:42px}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
.ltr{direction:ltr;text-align:left}

/* مكوّن: steps */
.tk-steps .stage{position:relative;height:170px;border-radius:18px;background:linear-gradient(135deg,var(--chip),var(--surface));border:1px solid var(--line);overflow:hidden}
.tk-steps .actor{position:absolute;top:50%;transform:translateY(-50%);text-align:center;width:22%;transition:.4s}
.tk-steps .actor.a{inset-inline-start:3%}.tk-steps .actor.b{inset-inline-end:3%}
.tk-steps .actor i{font-style:normal;font-size:2.4rem;display:block}
.tk-steps .actor b{font-size:.78rem;display:block;line-height:1.3}
.tk-steps .actor em{font-style:normal;font-size:.7rem;color:var(--muted);display:block;min-height:1.2em}
.tk-steps .mover{position:absolute;top:34%;width:2.8rem;margin-inline-start:-1.4rem;font-size:2rem;text-align:center;transition:inset-inline-start .9s cubic-bezier(.65,.05,.25,1),opacity .3s;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.tk-steps .stage.ok{box-shadow:inset 0 0 0 2px var(--ok),0 0 24px rgba(22,163,74,.25)}
.tk-steps .stage.bad{box-shadow:inset 0 0 0 2px var(--bad),0 0 24px rgba(229,72,77,.3)}
.tk-steps .dots{display:flex;gap:6px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.tk-steps .dots i{width:24px;height:6px;border-radius:99px;background:var(--chip);border:1px solid var(--line);transition:.25s}
.tk-steps .dots i.on{background:var(--blue);border-color:var(--blue)}
.tk-steps .cap{min-height:56px;text-align:center;font-weight:800;color:var(--blue);margin:6px 0;font-size:.95rem;line-height:1.7}
.tk-steps .ctrl{text-align:center}
.tk-steps .ctrl .btn{margin:3px}
/* cards */
.tk-cards{display:grid;gap:12px}.tk-cards.c2{grid-template-columns:repeat(2,1fr)}.tk-cards.c3{grid-template-columns:repeat(3,1fr)}.tk-cards.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.tk-cards.c3,.tk-cards.c4{grid-template-columns:1fr 1fr}}@media(max-width:480px){.tk-cards.c2,.tk-cards.c3,.tk-cards.c4{grid-template-columns:1fr}}
.tk-card{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;cursor:pointer;transition:.25s;text-align:center}
.tk-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,158,226,.16)}
.tk-card.open{border-color:var(--blue);background:var(--surface2);box-shadow:0 0 0 3px rgba(0,158,226,.15)}
.tk-card .h{font-weight:900}.tk-card .h i{font-style:normal;font-size:1.8rem;display:block}
.tk-card .b{max-height:0;opacity:0;overflow:hidden;transition:max-height .4s,opacity .3s;text-align:start;font-size:.86rem;color:var(--muted);line-height:1.7}
.tk-card.open .b{max-height:420px;opacity:1;margin-top:8px}
/* compare */
.tk-cmp .seg{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.tk-cmp .pane{display:none;animation:tkfade .4s}.tk-cmp .pane.on{display:block}
@keyframes tkfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tk-cmp .pane.good{border-inline-start:5px solid var(--ok)}.tk-cmp .pane.badp{border-inline-start:5px solid var(--bad)}
/* terminal */
.tk-term,.tk-shell{background:var(--code);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #1a2f3a}
.tk-term .bar,.tk-shell .bar{background:#13262f;padding:8px 12px;display:flex;gap:6px;align-items:center}
.tk-term .bar i,.tk-shell .bar i{width:10px;height:10px;border-radius:50%;display:block}
.tk-term .bar span,.tk-shell .bar span{margin-inline-start:8px;font-size:.72rem;color:#8fb3c0;direction:ltr}
.tk-term pre,.tk-shell .out{margin:0;padding:12px 16px;font-family:'Cascadia Code','Courier New',monospace;font-size:.78rem;line-height:1.75;color:#e6edf3;
  direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;min-height:130px;max-height:340px;overflow:auto}
.tk-term .cmd,.tk-shell .cmd{color:#7ee787}.tk-term .ok,.tk-shell .ok{color:#56d364}.tk-term .bad,.tk-shell .bad{color:#ff7b72}.tk-term .dim,.tk-shell .dim{color:#7d8f99}.tk-term .hl,.tk-shell .hl{color:#f7b228}
.tk-shell .in{display:flex;gap:8px;align-items:center;border-top:1px solid #1a2f3a;padding:8px 14px;direction:ltr}
.tk-shell .in span{color:#7ee787;font-family:'Cascadia Code','Courier New',monospace;font-size:.78rem;white-space:nowrap}
.tk-shell .in input{background:transparent;border:0;color:#fff;font-family:'Cascadia Code','Courier New',monospace;font-size:.82rem;direction:ltr;text-align:left;min-height:30px;padding:2px}
.tk-shell .in input:focus{outline:none}
.tk-tasks{margin-top:10px}
.tk-tasks .t{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:var(--surface);font-size:.88rem;transition:.3s}
.tk-tasks .t.done{border-color:var(--ok);background:rgba(22,163,74,.1)}
.tk-tasks .t .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.75rem;flex:none}
.tk-tasks .t.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
/* scan grid */
.tk-grid .cells{display:grid;gap:7px;max-width:560px;margin:0 auto}
.tk-grid .c{border-radius:10px;padding:9px 4px;text-align:center;font-family:'Cascadia Code','Courier New',monospace;font-size:.75rem;font-weight:800;background:var(--chip);border:1px solid var(--line);transition:.3s;direction:ltr}
.tk-grid .c.scan{background:rgba(0,158,226,.25);border-color:var(--blue);transform:scale(1.08)}
.tk-grid .c.open,.tk-grid .c.ok{background:rgba(22,163,74,.2);border-color:var(--ok);color:var(--ok)}
.tk-grid .c.closed,.tk-grid .c.bad{background:rgba(229,72,77,.15);border-color:var(--bad);color:var(--bad)}
.tk-grid .c.filtered{background:rgba(247,178,40,.2);border-color:var(--yellow)}
.tk-grid .sum{text-align:center;font-weight:800;margin-top:12px;min-height:26px}
/* transform / gear */
.tk-tf .row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
@media(max-width:640px){.tk-tf .row{grid-template-columns:1fr}.tk-tf .gear{margin:0 auto}}
.tk-tf .box{background:var(--code);color:#7ee787;border-radius:12px;padding:12px 14px;font-family:'Cascadia Code','Courier New',monospace;direction:ltr;text-align:left;font-size:.78rem;word-break:break-all;min-height:48px;display:flex;align-items:center}
.tk-tf .gear{font-size:2.2rem;text-align:center}
.spinning{animation:tkspin .9s linear infinite}@keyframes tkspin{to{transform:rotate(360deg)}}
/* lab */
.tk-lab{border:2px solid var(--blue);border-radius:22px;background:var(--surface);padding:16px 18px;margin:12px 0;box-shadow:var(--shadow);position:relative}
.tk-lab .lh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tk-lab .lh b{font-size:1.05rem}.tk-lab .badge{background:var(--blue);color:#fff;border-radius:99px;padding:2px 12px;font-size:.74rem;font-weight:900}
.tk-lab .req{background:rgba(0,158,226,.09);border:1px solid rgba(0,158,226,.3);border-radius:12px;padding:8px 12px;font-size:.84rem;margin:8px 0}
.tk-lab .stp{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;background:var(--surface2);transition:.2s;font-size:.9rem;line-height:1.7}
.tk-lab .stp:hover{border-color:var(--blue)}
.tk-lab .stp .n{width:26px;height:26px;border-radius:50%;background:var(--chip);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.78rem;flex:none}
.tk-lab .stp.done{border-color:var(--ok);background:rgba(22,163,74,.09)}.tk-lab .stp.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.tk-lab .stp.done .tx{opacity:.75}
.tk-lab .pm{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:10px;border:1px solid var(--line)}.tk-lab .pm i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .3s}
.tk-tool{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;background:var(--surface2)}
.tk-tool .ti{font-size:1.9rem;flex:none}.tk-tool b{display:block}.tk-tool .w{font-size:.84rem;color:var(--muted)}
.tk-tool a{color:var(--blue);font-weight:800;text-decoration:none;font-size:.84rem}
/* challenge */
.tk-ch{border:2px dashed var(--yellow);border-radius:20px;padding:14px 18px;background:linear-gradient(135deg,rgba(247,178,40,.12),transparent);margin:14px 0;position:relative}
.tk-ch .chh{font-weight:900;margin-bottom:6px}.tk-ch .chh span{background:var(--yellow);color:#1b2b2c;border-radius:99px;padding:2px 12px;font-size:.74rem;margin-inline-end:8px}
.tk-ch .row{display:flex;gap:8px;margin-top:8px}.tk-ch .res{margin-top:8px;font-weight:800;min-height:24px}
.tk-ch.solved{border-style:solid;border-color:var(--ok);background:rgba(22,163,74,.1)}
/* scenario / classify */
.tk-sc .opt,.tk-cl .it{display:block;width:100%;text-align:start;padding:12px 16px;margin:8px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.tk-sc .opt:hover,.tk-cl .it:hover{border-color:var(--blue)}
.tk-sc .opt.ok{border-color:var(--ok);background:rgba(22,163,74,.12)}.tk-sc .opt.no{border-color:var(--bad);background:rgba(229,72,77,.1)}
.tk-cl .its{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tk-cl .it{width:auto;margin:0;padding:8px 14px}.tk-cl .it.sel{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(247,178,40,.3)}
.tk-cl .it.done{opacity:.55;pointer-events:none;border-color:var(--ok)}
.tk-cl .bks{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tk-cl .bk{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:90px;text-align:center;cursor:pointer;background:var(--surface)}
.tk-cl .bk:hover{border-color:var(--blue)}.tk-cl .bk b{display:block}.tk-cl .bk .got{font-size:.78rem;color:var(--ok);margin-top:6px;line-height:1.6}
.tk-cl .fb{min-height:24px;text-align:center;font-weight:800;margin-top:8px}
/* live tools */
.tk-live label{font-size:.8rem;font-weight:800;display:block;margin:10px 0 4px}
.tk-live .meter{height:14px;border-radius:99px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin:10px 0}.tk-live .meter i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.tk-live .out{background:var(--code);color:#7ee787;border-radius:12px;padding:10px 14px;font-family:'Cascadia Code','Courier New',monospace;direction:ltr;text-align:left;font-size:.78rem;word-break:break-all;min-height:44px}
.wheelwrap{position:relative;width:260px;height:260px;margin:10px auto;background:var(--code);border-radius:50%;box-shadow:inset 0 0 0 2px #1a2f3a}
.wheelwrap .ring{position:absolute;inset:0;transition:transform .6s ease}.wheelwrap .l{position:absolute;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;font-family:'Courier New',monospace}
/* quiz / audit / misc */
.quiz-opt{display:block;width:100%;text-align:start;padding:12px 16px;margin:8px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.quiz-opt:hover{border-color:var(--blue)}.quiz-opt.correct{background:rgba(22,163,74,.14);border-color:var(--ok);color:var(--ok)}.quiz-opt.wrong{background:rgba(229,72,77,.12);border-color:var(--bad);color:var(--bad)}
/* تحقّق سريع صح/خطأ بعد كل موضوع */
.tk-quick{border:1.5px dashed var(--blue);border-radius:16px;padding:12px 16px;margin:14px 0;background:rgba(0,158,226,.05)}
.tk-quick .qh{font-weight:900;font-size:.85rem;color:var(--blue);margin-bottom:6px}
.tk-quick .qs{font-weight:800;margin:0 0 10px}
.tk-quick .opts{display:flex;gap:8px;flex-wrap:wrap}
.tk-quick .opts .quiz-opt{flex:1;min-width:110px;width:auto;margin:0;text-align:center;padding:9px 14px;font-size:.88rem}
.tk-quick .fb{margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots i{width:22px;height:6px;border-radius:99px;background:var(--chip);border:1px solid var(--line)}.dots i.on{background:var(--blue);border-color:var(--blue)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;margin:8px 0;cursor:pointer;font-weight:700;font-size:.92rem}
.toggle .sw{width:46px;height:26px;border-radius:99px;background:#9fb2b6;position:relative;flex:none;transition:.2s}
.toggle .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{border-color:var(--green);background:rgba(37,211,102,.1)}.toggle.on .sw{background:var(--green)}.toggle.on .sw::after{inset-inline-start:23px}
.agenda li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:center;flex-wrap:wrap;list-style:none}
.agenda{padding:0;margin:0}.agenda .t{background:var(--blue);color:#fff;font-weight:800;padding:3px 12px;border-radius:99px;font-size:.78rem;white-space:nowrap}
.timerbig{font-size:clamp(2.6rem,10vw,4.5rem);font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.reslink{display:block;padding:10px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;margin-top:8px;color:var(--blue);font-weight:800;font-size:.86rem;text-decoration:none}
.reslink:hover{border-color:var(--blue)}
.pop{animation:tkpop .45s}@keyframes tkpop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
/* فهرس الشرائح */
.tk-drawer{position:fixed;inset:0;z-index:50;display:none}.tk-drawer.open{display:block}
.tk-drawer .bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.tk-drawer .pn{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(360px,88vw);background:var(--surface2);border-inline-start:1px solid var(--line);padding:16px;overflow-y:auto}
.tk-drawer .pn button.it{display:flex;gap:10px;width:100%;text-align:start;background:none;border:0;border-bottom:1px dashed var(--line);padding:10px 4px;color:var(--text);font:inherit;cursor:pointer;font-size:.88rem}
.tk-drawer .pn button.it.cur{color:var(--blue);font-weight:900}.tk-drawer .pn .n{color:var(--muted);min-width:24px}
/* طباعة / PDF: نهاري دائماً */
@media print{
  html[data-theme="dark"]{--bg:#fff;--bg2:#fff;--surface:#fff;--surface2:#fff;--text:#111;--muted:#444;--line:#ccc;--code:#f3f3f3;--codetext:#111;--chip:#f2f2f2;--shadow:none}
  body{overflow:visible;background:#fff}body::before,body::after,html::before,html::after,.tk-nav,header.tk-head .tk-ic,.tk-steps .ctrl,.tk-drawer{display:none!important}
  #deck{height:auto}.tk-stage{overflow:visible}.slide{position:static;opacity:1;transform:none;pointer-events:auto;page-break-after:always;padding:10px 0;overflow:visible}
  .card{box-shadow:none;break-inside:avoid}
}

.tk-shell .out span,.tk-term pre span{unicode-bidi:plaintext}

<body>
<div id="deck">
  <div class="tk-topbar"></div>
  <header class="tk-head">
    <div class="tk-logo"><img src="https://tweetkod.com/wp-content/uploads/2024/05/Tweetkod.png" alt="TweetKod" onerror="this.outerHTML='<b style=&quot;color:#009EE2;font-size:.9rem&quot;>TweetKod</b>'"></div>
    <div class="tk-titles"><div class="l">المستوى الأول · الوحدة 2</div><div class="m">Linux من الصفر: الطرفية أداتك الأولى</div></div>
    <div class="tk-prog"><div class="bar"><i id="tkBar"></i></div><span id="tkCount">1 / 1</span></div>
    <span class="tag" id="tkPts" title="نقاط التحديات">🏅 0</span>
    <button class="tk-ic" id="tkMenu" title="فهرس الشرائح" aria-label="فهرس الشرائح">☰</button>
    <button class="tk-ic" id="tkFm" title="تصغير الخط" aria-label="تصغير الخط">أ-</button>
    <button class="tk-ic" id="tkFp" title="تكبير الخط" aria-label="تكبير الخط">أ+</button>
    <button class="tk-ic" id="tkTheme" title="ليل / نهار" aria-label="تبديل الوضع الليلي">🌙</button>
  </header>
  <div class="tk-stage" id="stage"></div>
  <div class="tk-nav"><button class="btn ghost" id="tkPrev">◀ السابق</button><button class="btn blue" id="tkNext">التالي ▶</button></div>
</div>
<div class="tk-drawer" id="tkDrawer"><div class="bk"></div><div class="pn"></div></div>
<script>
/* TweetKod lib — مكوّنات نقيّة (تعمل في المتصفح وفي Node للفحص وتوليد GIFT) */
(function(root){
  const TK = root.TK = { reg: [], _n: 0 };
  const nid = p => 'tk' + p + (++TK._n);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  TK.esc = esc;
  const reg = (k, cfg) => { TK.reg.push(Object.assign({ k }, cfg)); return cfg.id; };

  /* ---------- هيكل الوحدة ---------- */
  TK.module = function(cfg){ root.TK_MODULE = cfg; return cfg; };

  /* ---------- شرائح عامة ---------- */
  TK.s = (title, en, body) => '<div class="in"><h2 class="tk-h2">' + title + (en ? '<span class="en">' + en + '</span>' : '') + '</h2>' + body + '</div>';
  TK.concept = c => (TK._concepts = (TK._concepts || 0) + 1, 0) || TK.s('💡 ' + c.t, c.en || '', '<div class="card"><span class="tag">⏱️ مفهوم سريع · ' + (c.min || '3 د') + '</span><div class="mt">' + c.body + '</div></div>' +
      (c.key ? '<div class="tip"><b>🎯 الفكرة في جملة:</b> ' + c.key + '</div>' : ''));
  TK.code = (text, cls) => '<div class="codebox ' + (cls || '') + '">' + esc(text) + '</div>';
  TK.table = (head, rows) => '<div class="tblwrap"><table class="tbl"><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr>' +
      rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</table></div>';
  TK.terms = list => '<dl class="term"><b>📖 مصطلحات مهمة</b>' + list.map(x => '<dt>' + x[0] + '</dt><dd>' + x[1] + '</dd>').join('') + '</dl>';
  TK.tool = c => '<div class="tk-tool"><div class="ti">' + (c.e || '🛠️') + '</div><div><b>' + c.n + (c.free === false ? '' : ' <span class="tag">مجاني</span>') + '</b>' +
      '<div class="w"><b style="display:inline">ما هي؟</b> ' + c.what + '</div><div class="w"><b style="display:inline">لماذا نستخدمها؟</b> ' + c.why + '</div>' +
      (c.how ? '<div class="w"><b style="display:inline">كيف؟</b> ' + c.how + '</div>' : '') +
      (c.url ? '<a href="' + c.url + '" target="_blank" rel="noopener">🔗 ' + c.url.replace(/^https?:\/\//, '') + '</a>' : '') + '</div></div>';
  TK.breakSlide = next => '<div class="in"><div class="center"><div class="big-emoji">☕</div><div class="kicker">استراحة</div><h1 class="tk-h1">10 دقائق راحة</h1>' +
      '<div class="timerbig" data-tk-timer>10:00</div><div class="mt"><button class="btn" data-tk-timer-start>▶️ بدء العدّاد</button> <button class="btn ghost" data-tk-timer-reset>↺ إعادة</button></div>' +
      (next ? '<p class="lead mt2">' + next + '</p>' : '') + '</div></div>';
  TK.recap = (title, items) => '<div class="in"><div class="center"><div class="big-emoji">✅</div><h2 class="tk-h2" style="justify-content:center">' + title + '</h2><div class="card" style="max-width:640px;text-align:start"><ul class="clean">' +
      items.map(i => '<li>' + i + '</li>').join('') + '</ul></div></div></div>';

  /* ---------- steps: حركة تنقّل بين طرفين (a = بداية القراءة، b = النهاية) ---------- */
  TK.steps = c => {
    const id = nid('st'); reg('steps', { id, steps: c.steps });
    return '<div class="tk-steps card" id="' + id + '"><div class="stage"><div class="actor a"><i>' + c.a.e + '</i><b>' + c.a.l + '</b><em></em></div>' +
      '<div class="actor b"><i>' + c.b.e + '</i><b>' + c.b.l + '</b><em></em></div><div class="mover"></div></div><div class="dots"></div><p class="cap"></p>' +
      '<div class="ctrl"><button class="btn blue s" data-a="next">▶ الخطوة التالية</button><button class="btn ghost s" data-a="prev">◀ السابقة</button><button class="btn ghost s" data-a="reset">↺ من البداية</button></div></div>';
  };
  /* ---------- cards: بطاقات كشف (واحدة مفتوحة في كل مرة) ---------- */
  TK.cards = c => {
    const id = nid('cd'); reg('cards', { id });
    return '<div class="tk-cards c' + (c.cols || 3) + '" id="' + id + '">' + c.items.map(i => '<div class="tk-card"><div class="h"><i>' + (i.e || '•') + '</i>' + i.t + '</div><div class="b">' + i.b + '</div></div>').join('') + '</div>';
  };
  /* ---------- compare: لوحتان بمفتاح تبديل ---------- */
  TK.compare = c => {
    const id = nid('cp'); reg('compare', { id });
    return '<div class="tk-cmp card" id="' + id + '"><div class="seg"><button class="btn blue s" data-i="0">' + c.a.t + '</button><button class="btn ghost s" data-i="1">' + c.b.t + '</button></div>' +
      '<div class="pane on ' + (c.a.bad ? 'badp' : 'good') + '">' + c.a.html + '</div><div class="pane ' + (c.b.bad ? 'badp' : 'good') + '">' + c.b.html + '</div></div>';
  };
  /* ---------- terminal: عرض متحرّك لمخرجات أداة ---------- */
  TK.terminal = c => {
    const id = nid('tm'); reg('terminal', { id, lines: c.lines, ms: c.ms || 420 });
    return '<div class="tk-term" id="' + id + '"><div class="bar"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i><span>' + esc(c.title || 'terminal') + '</span></div><pre>اضغط تشغيل لمشاهدة التنفيذ…</pre></div>' +
      '<div class="tc mt"><button class="btn blue s" data-tk-run="' + id + '">▶ ' + (c.btn || 'شغّل المحاكاة') + '</button></div>';
  };
  /* ---------- scan: شبكة فحص متتابع ---------- */
  TK.scan = c => {
    const id = nid('sc'); reg('scan', { id, cells: c.cells, labels: c.labels || {} , ms: c.ms || 140 });
    return '<div class="tk-grid card" id="' + id + '"><div class="cells" style="grid-template-columns:repeat(' + (c.cols || 5) + ',1fr)">' +
      c.cells.map(x => '<div class="c" title="' + esc(x.tip || '') + '">' + esc(x.t) + '</div>').join('') + '</div><div class="sum"></div><div class="tc"><button class="btn blue s" data-a="go">▶ ' + (c.btn || 'ابدأ الفحص') + '</button> <button class="btn ghost s" data-a="reset">↺</button></div></div>';
  };
  /* ---------- transform: مدخل → آلة → مخرج (sha256 حقيقي أو ناتج ثابت) ---------- */
  TK.transform = c => {
    const id = nid('tf'); reg('transform', { id, fn: c.fn || 'none', output: c.output || '', after: c.after || '' });
    return '<div class="tk-tf card" id="' + id + '"><div class="row"><div><label class="sm muted">' + (c.inLabel || 'المُدخل') + '</label>' +
      (c.editable === false ? '<div class="box">' + esc(c.input) + '</div>' : '<input type="text" class="ltr" value="' + esc(c.input) + '">') + '</div>' +
      '<div class="gear">' + (c.gear || '⚙️') + '<div class="sm muted">' + (c.label || '') + '</div></div><div><label class="sm muted">' + (c.outLabel || 'المُخرَج') + '</label><div class="box out">—</div></div></div>' +
      '<div class="tc mt"><button class="btn blue s" data-a="go">▶ ' + (c.btn || 'شغّل') + '</button></div><p class="sm muted tc after"></p></div>';
  };
  /* ---------- lab: مختبر بخطوات قابلة للتأشير ---------- */
  TK.lab = c => {
    const id = nid('lb'); reg('lab', { id, n: c.steps.length });
    return '<div class="tk-lab" id="' + id + '"><div class="lh"><span class="badge">🧪 مختبر عملي</span><b>' + c.t + '</b>' + (c.time ? '<span class="tag">⏱️ ' + c.time + '</span>' : '') + '</div>' +
      (c.req ? '<div class="req">✅ <b>المتطلبات:</b> ' + c.req + '</div>' : '') + c.steps.map((s, i) => '<div class="stp" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span class="tx">' + s + '</span></div>').join('') +
      (c.tools ? c.tools.map(t => '<a class="reslink" href="' + t.u + '" target="_blank" rel="noopener">🔗 ' + t.n + '</a>').join('') : '') +
      (c.tip ? '<div class="tip"><b>💡</b> ' + c.tip + '</div>' : '') + (c.warn ? '<div class="warn"><b>⚠️</b> ' + c.warn + '</div>' : '') +
      '<div class="pm"><i></i></div></div>';
  };
  /* ---------- challenge: تحدٍّ بإجابة قابلة للتحقق ---------- */
  TK.challenge = c => {
    const id = nid('ch'); reg('challenge', { id, answer: [].concat(c.answer), re: c.re || null, pts: c.pts || 10, explain: c.explain || '' });
    return '<div class="tk-ch" id="' + id + '"><div class="chh"><span>🏁 تحدٍّ ' + (c.pts || 10) + ' نقاط</span>' + (c.t || '') + '</div><div>' + c.q + '</div>' +
      '<div class="row"><input type="text" class="ltr" placeholder="' + esc(c.ph || 'اكتب إجابتك هنا…') + '" autocomplete="off"><button class="btn s" data-a="chk">تحقّق</button>' + (c.hint ? '<button class="btn ghost s" data-a="hint">تلميح</button>' : '') + '</div>' +
      '<div class="res"></div>' + (c.hint ? '<div class="sm muted hint" style="display:none">💡 ' + c.hint + '</div>' : '') + '</div>';
  };
  /* ---------- scenario: قرارات متتالية ---------- */
  TK.scenario = c => {
    const id = nid('sn'); reg('scenario', { id, steps: c.steps });
    return '<div class="tk-sc card" id="' + id + '"><div class="sh"></div><div class="so"></div><div class="sf"></div></div>';
  };
  /* ---------- classify: صنّف العناصر في صناديق ---------- */
  TK.classify = c => {
    const id = nid('cl'); reg('classify', { id, items: c.items, buckets: c.buckets });
    return '<div class="tk-cl card" id="' + id + '"><p class="sm muted">اختر عنصراً ثم اضغط الصندوق الصحيح.</p><div class="its"></div><div class="bks"></div><div class="fb"></div></div>';
  };
  /* ---------- check: تحقّق سريع صح/خطأ بعد كل موضوع (تنشيط فوري، لا يُحتسب في الاختبار النهائي) ---------- */
  TK.check = c => {
    const id = nid('ch'); reg('check', { id, s: c.s, t: c.t, why: c.why });

    { q: 'ما وظيفة الأمر <code>cat</code>؟', ok: 'قراءة محتوى ملف نصي وطباعته على الشاشة', no: ['إنشاء مجلد جديد', 'تغيير صلاحيات ملف', 'البحث داخل محتوى ملف'], why: 'cat تختصر concatenate، وأشهر استخداماتها طباعة محتوى الملف مباشرة.' },

    { q: 'ما وظيفة الرمز <code>|</code> (الأنبوب) بين أمرين؟', ok: 'يمرّر ناتج الأمر الأول ليكون مدخلاً للأمر الثاني', no: ['يحذف ناتج الأمر الأول قبل تنفيذ الثاني', 'يشغّل الأمرين في الوقت نفسه دون علاقة بينهما', 'يحفظ ناتج الأمر الأول في ملف تلقائياً'], why: 'الأنبوب يصل الأوامر ببعضها، مثل grep Failed log | wc -l الذي يمرّر نتائج grep إلى wc -l لتُعدّ.' },
    { q: 'في صلاحيات <code>-rwxr-xr-x</code>، ماذا يملك صاحب الملف (المالك)؟', ok: 'القراءة والكتابة والتنفيذ', no: ['القراءة والتنفيذ فقط دون كتابة', 'الكتابة فقط', 'لا صلاحيات له على ملفه'], why: 'المجموعة الثلاثية الأولى (rwx) تخص المالك دائماً، وهنا تملك الحروف الثلاثة كاملة: قراءة وكتابة وتنفيذ.' },
    { q: 'لماذا يفحص محلل الأمن مجلد <code>/tmp</code> غالباً أثناء التحقيق؟', ok: 'لأنه مفتوح للكتابة من كل المستخدمين فيحبّه المهاجمون لإخفاء أدواتهم', no: ['لأنه محمي بالكامل ولا يصل إليه أحد', 'لأنه يحتوي سجلات النظام فقط', 'لأنه المجلد الوحيد القابل للتنفيذ'], why: '/tmp مفتوح للكتابة من كل المستخدمين عادة، ولهذا يستخدمه المهاجمون أحياناً لإخفاء أدوات أو ملفات مؤقتة.' },
    { q: 'وجدت ملفاً تنفيذياً مجهول المصدر بصلاحية x في النظام. ما التصرف الآمن؟', ok: 'أقرأه بـ cat دون تشغيله، ثم أوثّقه وأبلغ المسؤول', no: ['أشغّله فوراً لأرى ماذا يفعل', 'أتجاهله لأنه غالباً غير مهم', 'أحذفه مباشرة دون توثيق'], why: 'تشغيل ملف مجهول قد ينفّذ كوداً ضاراً فوراً، والحذف يضيّع الدليل، فالقراءة والتوثيق والإبلاغ هي الخطوات الصحيحة.' },
    { q: 'ما الفرق الجوهري بين الأمرين <code>cp</code> و<code>mv</code>؟', ok: 'cp ينسخ ويُبقي الملف الأصلي، بينما mv ينقل الملف فيختفي من مكانه الأول', no: ['لا فرق؛ الأمران متطابقان تماماً', 'cp يحذف الملف الأصلي بعد النسخ', 'mv يعمل فقط مع المجلدات لا الملفات'], why: 'cp نسخ حقيقي يترك الأصل كما هو، أما mv فينقل الملف (أو يعيد تسميته) ويزيله من موضعه القديم.' }
  ],
  audit: ['نفّذت ls و cd و pwd و cat في الطرفية التدريبية', 'عثرت على العلم المخفي باستخدام ls -a', 'استخدمت grep لتصفية سجل الدخول', 'استخدمت الأنبوب | مع wc -l', 'كشفت عنوان IP المهاجم من السجل', 'نظّمت ملفات بـ mkdir وcp وmv ورتّبت بياناتٍ بـ sort وuniq'],
  recap: ['الطرفية أسرع وأدق من الواجهة الرسومية في الأمن', 'ls -a و cat و grep و find أدواتك الأربع الأولى للتحقيق', 'cp تنسخ وتُبقي الأصل، mv تنقل وتزيل الأصل، rm تحذف نهائياً', 'اقرأ الملف المجهول ولا تشغّله، ثم وثّق وأبلغ'],
  homework: 'افتح طرفية المختبر ٣ من جديد ونفّذ تسلسلاً كاملاً بنفسك: أنشئ مجلداً، انسخ ملفاً إليه، رتّب بياناته، واحذف نسخة لم تعد تحتاجها. دوّن كل أمر استخدمته في ملف ملاحظات.',
  resources: [{ t: 'Ubuntu — تعلّم الطرفية', u: 'https://ubuntu.com/tutorials/command-line-for-beginners' }, { t: 'picoCTF — General Skills', u: 'https://picoctf.org/' }, { t: 'Kali Linux — التوثيق الرسمي', u: 'https://www.kali.org/docs/' }],
  next: 'في الوحدة القادمة: كلمات المرور والمصادقة — ستكسر Hash ضعيفاً داخل المختبر وتبني دفاعك.'
});

<script>
/* TweetKod engine — يبني الشرائح ويربط المكوّنات ويدير الثيم والتنقل */
(function(){
  'use strict';
  const M = window.TK_MODULE, TK = window.TK;
  const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = TK.esc;
  const store = {
    get(k, d){ try { const v = localStorage.getItem('tk:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v){ try { localStorage.setItem('tk:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const LV = M.level === 1 ? 'المستوى الأول' : 'المستوى الثاني';
  const KEY = M.id + ':';
  const safe = (fn, name) => { try { fn(); } catch (e) { console.error('TK component failed:', name, e); } };

  /* ---------- الثيم والخط ---------- */
  const root = document.documentElement;
  function setTheme(t){ root.setAttribute('data-theme', t); store.set('theme', t); const b = $('#tkTheme'); if (b) b.textContent = t === 'dark' ? '☀️' : '🌙'; }
  let th = store.get('theme', null);
  if (!th) th = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  let fs = store.get('fs', 1);
  function setFs(v){ fs = Math.max(.85, Math.min(1.4, v)); root.style.setProperty('--fs', fs); store.set('fs', fs); }
  setFs(fs);

  /* ---------- بناء الشرائح ---------- */
  const labs = TK.reg.filter(r => r.k === 'lab').length + TK.reg.filter(r => r.k === 'shell').length;
  const chs = TK.reg.filter(r => r.k === 'challenge').length;
  const anims = TK.reg.filter(r => ['steps', 'terminal', 'scan', 'transform', 'compare', 'cards', 'scenario', 'classify'].includes(r.k)).length;
  const S = [];
  S.push('<div class="in"><div class="center"><div class="big-emoji">' + (M.emoji || '🛡️') + '</div><div class="kicker">TweetKod · ' + LV + ' — الوحدة ' + M.num + '</div>' +
    '<h1 class="tk-h1">' + M.title + '<span class="en">' + (M.en || '') + '</span></h1><p class="lead">' + (M.lead || '') + '</p><div class="mt">' +
    '<span class="tag">⏱️ 90 دقيقة</span><span class="tag">🧪 ' + labs + ' مختبرات عملية</span><span class="tag">🏁 ' + chs + ' تحديات</span><span class="tag">🎬 ' + anims + ' تفاعلات</span>' +
    (M.tags || []).map(t => '<span class="tag">' + t + '</span>').join('') + '</div></div></div>');
  S.push(TK.s('خطة الجلسة', 'Session roadmap', '<div class="card"><ul class="agenda">' + (M.agenda || []).map(a => '<li><span>' + a.t + '</span><span class="t">' + a.time + '</span></li>').join('') + '</ul></div>' +
    '<div class="flag">⚖️ <b>تذكير الأخلاقيات:</b> كل تطبيق عملي يتم داخل مختبر معزول أو منصة تدريب قانونية. لا تفحص أو تختبر أي نظام لا تملكه أو لا تملك إذناً كتابياً به.</div>'));
  (M.slides || []).forEach(h => S.push(h));
  S.push(TK.s('🎯 اختبار الوحدة (تدريبي)', M.quiz.length + ' أسئلة · أجوبة فورية مع تفسير', '<p class="lead">للمراجعة فقط — الاختبار الرسمي على منصة مودل. ترتيب الخيارات يتغيّر في كل محاولة.</p><div class="card" id="tkQuiz"></div>'));
  S.push(TK.s('🏆 مشروع الوحدة: أشّر ما أنجزته فعلياً', 'Hands-on checklist', '<div class="card" id="tkAudit"></div><p id="tkAuditScore" class="tc" style="font-size:1.2rem;font-weight:900"></p>'));
  S.push(TK.s('📌 الملخص والمراجع', 'Recap & resources', '<div class="grid g2"><div class="card"><b style="color:var(--blue)">تذكّر دائماً</b><ul class="clean">' + (M.recap || []).map(i => '<li>' + i + '</li>').join('') + '</ul></div>' +
    '<div class="card"><b style="color:var(--yellow)">📝 الواجب</b><p class="sm muted">' + (M.homework || '') + '</p></div></div><div class="card"><b style="color:var(--blue)">📚 كل الروابط</b>' +
    (M.resources || []).map(r => '<a class="reslink" href="' + r.u + '" target="_blank" rel="noopener">🔗 ' + r.t + '</a>').join('') + '</div>'));
  S.push('<div class="in"><div class="center"><div class="big-emoji">🏁</div><h1 class="tk-h1">أحسنتم! أنجزتم الوحدة ' + M.num + '</h1><p class="lead">' + (M.next || '') + '</p><span class="tag mt">فريق تويتكود التعليمية 💙</span></div></div>');

  const stage = $('#stage');
  S.forEach(h => { const d = document.createElement('section'); d.className = 'slide'; d.innerHTML = h.indexOf('class="in"') === 0 || h.indexOf('<div class="in">') === 0 ? h : '<div class="in">' + h + '</div>'; stage.appendChild(d); });
  const els = $$('.slide');
  const titles = els.map((e, i) => { const h = $('h2.tk-h2,h1.tk-h1', e); if (!h) return 'شريحة ' + (i + 1); const c = h.cloneNode(true); const en = $('.en', c); if (en) en.remove(); return c.textContent.trim(); });

  /* ---------- التنقل ---------- */
  let cur = 0;
  function render(){
    els.forEach((e, i) => e.classList.toggle('on', i === cur));
    $('#tkCount').textContent = (cur + 1) + ' / ' + els.length;
    $('#tkBar').style.width = ((cur + 1) / els.length * 100) + '%';
    $('#tkPrev').disabled = cur === 0; $('#tkNext').disabled = cur === els.length - 1;
    els[cur].scrollTop = 0;
    if (history.replaceState) history.replaceState(null, '', '#' + (cur + 1));
    $$('.tk-drawer .it').forEach((b, i) => b.classList.toggle('cur', i === cur));
  }
  function go(d){ cur = Math.max(0, Math.min(els.length - 1, cur + d)); render(); }
  function jump(i){ cur = i; render(); }
  $('#tkPrev').onclick = () => go(-1); $('#tkNext').onclick = () => go(1);
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft' || e.key === 'PageDown') go(1);
    if (e.key === 'ArrowRight' || e.key === 'PageUp') go(-1);
    if (e.key === 'Home') jump(0); if (e.key === 'End') jump(els.length - 1);
  });
  let tx = null; stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 70 && !/INPUT|TEXTAREA/.test((e.target || {}).tagName || '')) go(dx < 0 ? 1 : -1); }, { passive: true });

  /* ---------- الرأس: ثيم/خط/فهرس/طباعة ---------- */
  $('#tkTheme').onclick = () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  $('#tkFm').onclick = () => setFs(fs - .08); $('#tkFp').onclick = () => setFs(fs + .08);
  window.addEventListener('beforeprint', () => setTheme('light'));
  const dr = $('#tkDrawer');
  dr.querySelector('.pn').innerHTML = '<b>📑 فهرس الشرائح</b>' + titles.map((t, i) => '<button class="it"><span class="n">' + (i + 1) + '</span><span>' + esc(t) + '</span></button>').join('');
  $$('.it', dr).forEach((b, i) => b.onclick = () => { jump(i); dr.classList.remove('open'); });
  $('#tkMenu').onclick = () => dr.classList.add('open'); dr.querySelector('.bk').onclick = () => dr.classList.remove('open');
  setTheme(th);

  /* ---------- مؤقّت الاستراحة ---------- */
  (function(){
    let t = null, s = 600; const d = $('[data-tk-timer]'); if (!d) return;
    const paint = () => { d.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
    $('[data-tk-timer-start]').onclick = () => { if (t) return; t = setInterval(() => { s--; if (s <= 0) { clearInterval(t); t = null; d.textContent = 'انتهت الاستراحة ⏰'; } else paint(); }, 1000); };
    $('[data-tk-timer-reset]').onclick = () => { clearInterval(t); t = null; s = 600; paint(); };
  })();

  /* ---------- ربط المكوّنات ---------- */
  const W = {};
  W.steps = c => { const el = document.getElementById(c.id), st = $('.stage', el), mv = $('.mover', el), cap = $('.cap', el), dots = $('.dots', el); let i = 0;
    const pos = { a: '22%', mid: '50%', b: '78%' };
    function paint(){ const s = c.steps[i]; mv.textContent = s.icon || ''; mv.style.opacity = s.icon ? 1 : 0; mv.style.insetInlineStart = pos[s.at] || (typeof s.at === 'number' ? s.at + '%' : '50%');
      cap.textContent = s.cap; st.classList.remove('ok', 'bad'); if (s.flash) st.classList.add(s.flash);
      $$('.actor em', el).forEach((e, k) => { e.textContent = (k === 0 ? s.ba : s.bb) || ''; });
      dots.innerHTML = c.steps.map((_, k) => '<i class="' + (k <= i ? 'on' : '') + '"></i>').join(''); }
    el.addEventListener('click', e => { const a = e.target.getAttribute && e.target.getAttribute('data-a'); if (!a) return; if (a === 'next') i = Math.min(c.steps.length - 1, i + 1); if (a === 'prev') i = Math.max(0, i - 1); if (a === 'reset') i = 0; paint(); });
    paint(); };
  W.cards = c => { const el = document.getElementById(c.id); const cs = $$('.tk-card', el); cs.forEach(x => x.onclick = () => { const was = x.classList.contains('open'); cs.forEach(y => y.classList.remove('open')); if (!was) x.classList.add('open'); }); };
  W.compare = c => { const el = document.getElementById(c.id), bs = $$('.seg button', el), ps = $$('.pane', el);
    bs.forEach((b, i) => b.onclick = () => { bs.forEach((x, k) => { x.classList.toggle('blue', k === i); x.classList.toggle('ghost', k !== i); }); ps.forEach((p, k) => p.classList.toggle('on', k === i)); }); };
  W.terminal = c => { const el = document.getElementById(c.id), pre = $('pre', el); const btn = document.querySelector('[data-tk-run="' + c.id + '"]'); let run = 0;
    btn.onclick = () => { const my = ++run; pre.innerHTML = ''; let k = 0; (function next(){ if (my !== run || k >= c.lines.length) return; const l = c.lines[k++]; const sp = document.createElement('span'); sp.className = l[0]; sp.textContent = l[1] + '\n'; pre.appendChild(sp); pre.scrollTop = pre.scrollHeight; setTimeout(next, l[2] || c.ms); })(); }; };
  W.scan = c => { const el = document.getElementById(c.id), cells = $$('.c', el), sum = $('.sum', el); let run = 0;
    function reset(){ run++; cells.forEach(x => x.className = 'c'); sum.textContent = ''; }
    el.addEventListener('click', e => { const a = e.target.getAttribute && e.target.getAttribute('data-a'); if (a === 'reset') reset(); if (a === 'go') { reset(); const my = run; let k = 0, cnt = {};
      (function nx(){ if (my !== run) return; if (k > 0) { const p = cells[k - 1], s = c.cells[k - 1].s; p.className = 'c ' + s; cnt[s] = (cnt[s] || 0) + 1; }
        if (k >= cells.length) { sum.textContent = Object.keys(cnt).map(s => (c.labels[s] || s) + ': ' + cnt[s]).join(' · '); return; }
        cells[k].className = 'c scan'; k++; setTimeout(nx, c.ms); })(); } }); };
  W.transform = c => { const el = document.getElementById(c.id), inp = $('input', el), out = $('.out', el), gear = $('.gear', el), after = $('.after', el);
    el.addEventListener('click', e => { if (e.target.getAttribute('data-a') !== 'go') return; const v = inp ? inp.value : ''; out.textContent = '…'; gear.classList.add('spinning');
      setTimeout(() => { gear.classList.remove('spinning'); out.textContent = c.fn === 'sha256' ? TK.sha256(v) : (c.output || '—'); out.classList.add('pop'); setTimeout(() => out.classList.remove('pop'), 500); if (c.after) after.textContent = c.after; }, 1000); }); };
  W.lab = c => { const el = document.getElementById(c.id), st = $$('.stp', el), pm = $('.pm i', el); const k = KEY + c.id; let done = store.get(k, []);
    const paint = () => { st.forEach((s, i) => s.classList.toggle('done', done.indexOf(i) > -1)); pm.style.width = (done.length / c.n * 100) + '%'; };
    st.forEach((s, i) => s.onclick = () => { const p = done.indexOf(i); if (p > -1) done.splice(p, 1); else done.push(i); store.set(k, done); paint(); }); paint(); };
  W.challenge = c => { const el = document.getElementById(c.id), inp = $('input', el), res = $('.res', el); const k = KEY + c.id; const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
    const solved = () => { el.classList.add('solved'); res.innerHTML = '<span style="color:var(--ok)">✅ إجابة صحيحة! +' + c.pts + ' نقطة</span>' + (c.explain ? '<div class="sm muted" style="font-weight:600">' + c.explain + '</div>' : ''); };
    if (store.get(k, false)) solved();
    el.addEventListener('click', e => { const a = e.target.getAttribute && e.target.getAttribute('data-a'); if (a === 'hint') { const h = $('.hint', el); h.style.display = h.style.display === 'none' ? 'block' : 'none'; }
      if (a === 'chk') { const v = norm(inp.value); const ok = c.re ? new RegExp(c.re, 'i').test(inp.value.trim()) : c.answer.some(x => norm(x) === v); if (ok) { store.set(k, true); solved(); updScore(); } else { res.innerHTML = '<span style="color:var(--bad)">❌ ليست صحيحة بعد — راجع الخطوات وجرّب مرة أخرى.</span>'; } } });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-a=chk]', el).click(); }); };
  W.scenario = c => { const el = document.getElementById(c.id), h = $('.sh', el), o = $('.so', el), f = $('.sf', el); let i = 0, score = 0;
    function paint(){ if (i >= c.steps.length) { o.innerHTML = ''; h.innerHTML = '<div class="big" style="font-weight:900;font-size:1.4rem;text-align:center">النتيجة: ' + score + ' / ' + c.steps.length + '</div>'; f.innerHTML = '<div class="tc mt"><button class="btn blue s" data-a="re">↺ أعد المحاولة</button></div>'; return; }
      const s = c.steps[i]; h.innerHTML = '<span class="tag">الموقف ' + (i + 1) + ' من ' + c.steps.length + '</span><p style="font-weight:800">' + s.s + '</p>'; f.innerHTML = '';
      o.innerHTML = s.o.map((x, j) => '<button class="opt" dir="auto" data-j="' + j + '">' + x.t + '</button>').join(''); }
    el.addEventListener('click', e => { const b = e.target.closest ? e.target.closest('[data-j]') : null; if (e.target.getAttribute && e.target.getAttribute('data-a') === 're') { i = 0; score = 0; paint(); return; }

        case 'grep': { if (!rest.length) return 'usage: grep [-irn] pattern [file]'; const pat = rest[0], ic = has('i'), rr = has('r') || has('R'); const re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, m => m), ic ? 'i' : '');
          let re2; try { re2 = new RegExp(pat, ic ? 'i' : ''); } catch (e) { re2 = re; } const res = [];
          const scan = (txt, label) => String(txt).split('\n').forEach((ln, i) => { if (re2.test(ln)) res.push((label ? label + ':' : '') + (has('n') ? (i + 1) + ':' : '') + ln); });
